spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/orders_db
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true



  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml


server:
  port: 8080
  servlet:
    context-path:


jwt:
  secret: "mySuperSecretKeyForJWT_64chars_minimum__________CHANGE_ME_1234567890"
  expiration: 86400000



logging:
  level:
    org.example.order_app: DEBUG
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: DEBUG
    RequestMappingHandlerMapping: DEBUG
    org.hibernate.sql: DEBUG
    org.hibernate.orm.jdbc.bind: DEBUG